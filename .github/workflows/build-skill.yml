name: Build .skill

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Package skill
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-flash-orchestrator.skill
          path: dist/gemini-flash-orchestrator.skill
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/gemini-flash-orchestrator.skill \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Download gemini-flash-orchestrator.skill and import it."
